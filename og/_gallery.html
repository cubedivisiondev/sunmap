<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>SUNMAP OG Gallery</title>
<style>
body { margin: 0; padding: 40px; background: #111; color: #fff; font-family: 'Trebuchet MS', Arial, sans-serif; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.05em; margin: 0 0 8px; }
.sub { color: #aaa; font-size: 13px; margin-bottom: 24px; }
.entry { margin-bottom: 48px; }
.entry h3 { font-size: 14px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.7); margin: 32px 0 6px; padding-top: 24px; border-top: 1px solid #333; }
.entry h3 .hook { display: block; margin-top: 6px; font-size: 10px; letter-spacing: 0.15em; color: rgba(255,255,255,0.45); font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.image-wrap { background: #000; line-height: 0; border-radius: 4px; overflow: hidden; }
.image-wrap img { display: block; width: 100%; height: auto; }
.card .label { margin-top: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-left: 3px solid #ceba9d;
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #c0c0c0; padding: 7px 12px; border-radius: 3px; }
</style></head><body>
<h1>SUNMAP - OG Card Gallery</h1>
<div class="sub">1 entry x 5 formats. Auto-generated by scripts/generate-og.mjs. Review here before approving prod.</div>
<div class="entry" id="hub">
  <h3>hub<span class="hook">SUNMAP: Sunrise, Sunset and Twilight</span></h3>
  <div class="grid">
    <div class="card">
      <div class="image-wrap"><img src="sunmap-og.png" loading="lazy"
        alt="SUNMAP social card, Landscape 1200x630"></div>
      <div class="label">Landscape 1200x630</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="sunmap-og-youtube.png" loading="lazy"
        alt="SUNMAP social card, YouTube 1280x720"></div>
      <div class="label">YouTube 1280x720</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="sunmap-og-square.png" loading="lazy"
        alt="SUNMAP social card, Square 1080x1080"></div>
      <div class="label">Square 1080x1080</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="sunmap-og-pin.png" loading="lazy"
        alt="SUNMAP social card, Pin 1000x1500"></div>
      <div class="label">Pin 1000x1500</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="sunmap-og-story.png" loading="lazy"
        alt="SUNMAP social card, Story 1080x1920"></div>
      <div class="label">Story 1080x1920</div>
    </div>
  </div>
</div>
</body></html>
